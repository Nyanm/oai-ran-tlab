# SPDX-License-Identifier: MIT

include:
    - cn.yml
services:
    mysql:
        cpuset: "8-11"
    oai-amf:
        cpuset: "8-11"
    oai-smf:
        cpuset: "8-11"
    oai-upf:
        cpuset: "8-11"
    oai-ext-dn:
        cpuset: "8-11"
    dpdk-init:
        image: docker.io/library/oai-dpdk-init:latest
        network_mode: host
        container_name: dpdk-init
        entrypoint: "/tmp/setup_sriov.sh"
        privileged: true
        devices:
            - /dev/vfio:/dev/vfio/
        volumes:
            - ./setup.sh:/tmp/setup_sriov.sh
            - /lib/modules:/lib/modules
            - /usr/lib/modules:/usr/lib/modules
    oai-gnb:
        image: ${REGISTRY-oaisoftwarealliance/}oai-gnb-fhi72:${TAG:-develop}
        cap_add:
            - IPC_LOCK
            - SYS_NICE
        cap_drop:
            - ALL
        container_name: oai-gnb
        environment:
            TZ: Europe/Paris
            USE_ADDITIONAL_OPTIONS: --gNBs.[0].min_rxtxtime 6
        devices:
            - /dev/vfio:/dev/vfio/
        volumes:
            - ../../conf_files/gnb.sa.band77.106prb.fhi72.1x1.conf:/opt/oai-gnb/etc/gnb.conf
            - /dev/hugepages:/dev/hugepages
        cpuset: "16-23"
        networks:
            oai-net:
                ipv4_address: 172.21.18.20
            public_net:
                ipv4_address: 192.168.101.140
        healthcheck:
           test: /bin/bash -c "ps aux | grep -v grep | grep -c nr-softmodem"
           start_period: 10s
           interval: 5s
           timeout: 5s
           retries: 10
    oai-nr-oru:
        image: ${REGISTRY-oaisoftwarealliance/}oai-nr-oru:${TAG:-develop}
        cap_add:
            - IPC_LOCK
            - SYS_NICE
        cap_drop:
            - ALL
        container_name: oai-nr-oru
        environment:
            TZ: Europe/Paris
            USE_ADDITIONAL_OPTIONS: --vrtsim.role server
        devices:
            - /dev/vfio:/dev/vfio/
        volumes:
            - ../../conf_files/ru.band77.106prb.fhi72.1x1.conf:/opt/nr-oru/etc/nr-oru.conf
            - /dev/hugepages:/dev/hugepages
            - tmp_data:/tmp/
        cpuset: "24-31"
        depends_on:
           dpdk-init:
             condition: service_completed_successfully
        healthcheck:
           test: /bin/bash -c "ps aux | grep -v grep | grep -c nr-oru"
           start_period: 15s
           start_interval: 500ms
           interval: 5s
           timeout: 5s
           retries: 10
        ipc: host
    oai-nr-ue:
        image: ${REGISTRY-oaisoftwarealliance/}${NRUE_IMG:-oai-nr-ue}:${TAG:-develop}
        container_name: rfsim5g-oai-nr-ue
        cap_drop:
            - ALL
        cap_add:
            - NET_ADMIN  # for interface bringup
            - NET_RAW    # for ping
        environment:
            USE_ADDITIONAL_OPTIONS: -r 106 --numerology 1 --band 77 -C 4049760000 --ssb 516 --uicc0.imsi 208990100001100 --log_config.global_log_options level,nocolor,time --device.name vrtsim
        depends_on:
            - oai-nr-oru
        devices:
             - /dev/net/tun:/dev/net/tun
        volumes:
            - ../../conf_files/nrue.uicc.conf:/opt/oai-nr-ue/etc/nr-ue.conf
            - tmp_data:/tmp/
        cpuset: "32-39"
        networks:
            public_net:
                ipv4_address: 192.168.101.150
        healthcheck:
            test: /bin/bash -c "pgrep nr-uesoftmodem"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
            start_interval: 500ms
        ipc: host
networks:
    oai-net:
        driver: macvlan
        name: oai-net
        ipam:
            config:
                - subnet: "172.21.16.0/22"
                  ip_range: "172.21.18.20/32"
                  gateway: "172.21.19.254"
        driver_opts:
            com.docker.network.bridge.name: "oai-net"
            parent: ens1f0np0
volumes:
    tmp_data:
