{{- range $ueId:=$.Values.ueIds }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Chart.Name }}-{{$ueId}}
  labels:
    {{- include "oai-nr-ue-multi.labels" (list $ $ueId) |  nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "oai-nr-ue-multi.selectorLabels" (list $ $ueId) |  nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "oai-nr-ue-multi.selectorLabels" (list $ $ueId) |  nindent 8 }}
        app: oai-nr-ue-multi-{{$ueId}}
    spec:
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
    {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{ toYaml $.Values.imagePullSecrets | indent 8 }}
    {{- end }}
    {{- if $.Values.global }}{{ if $.Values.global.waitForRadio }}
      initContainers:
        - name: init
          image: docker.io/oaisoftwarealliance/oai-tcpdump-init:alpine-3.20
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until ping -c 1  {{ $.Values.config.rfSimServer }}; do echo waiting for oai-du to start; sleep 1; done
    {{- end }}{{ end }}
      containers:
      - name: nr-ue-{{$ueId}}
        image: "{{ $.Values.nfimage.repository }}:{{ $.Values.nfimage.version }}"
        imagePullPolicy: IfNotPresent
        securityContext:
          {{- toYaml $.Values.securityContext | nindent 12 }}
        volumeMounts:
          - mountPath: /opt/oai-nr-ue/etc
            name: configuration-{{$ueId}}
          - name: dev-net-tun
            mountPath: /dev/net/tun
          - name: source
            mountPath: /opt/oai-ran
          # USRP B210/B200 Mini
        {{- if eq $.Values.config.usrp "b2xx"}}
          - mountPath: /dev/bus/usb/
            name: usrp
        {{- end}}
        {{- if $.Values.resources.define}}
        resources:
          requests:
            memory: {{ $.Values.resources.requests.nf.memory | quote }}
            cpu: {{ $.Values.resources.requests.nf.cpu | quote }}
          limits:
            memory: {{ $.Values.resources.limits.nf.memory | quote }}
            cpu: {{ $.Values.resources.limits.nf.cpu | quote }}
        {{- end}}
        command: [ "/bin/bash", "-c" ]
        args:
          - export RFSIM_IP_ADDRESS=$(getent hosts $RFSIM_HOST | awk '{print $1}');
            export RFSIM_IP_ADDRESS=$(if [[ $RFSIM_IP_ADDRESS ]]; then echo $RFSIM_IP_ADDRESS; else echo $RFSIM_HOST;fi);      
            export UE_IP_ADDRESS=$(hostname -i);      
            {{- if eq $.Values.config.usrp "b2xx"}}
              /opt/oai-gnb/bin/uhd_images_downloader.py -t b2xx;
            {{- else if eq $.Values.config.usrp "n3xx" }}
              /opt/oai-gnb/bin/uhd_images_downloader.py -t n3xx;
            {{- else if eq $.Values.config.usrp "x3xx" }}
              /opt/oai-gnb/bin/uhd_images_downloader.py -t x3xx;
            {{- end }}
            sed -e s/@RFSIM_IP_ADDRESS@/$RFSIM_IP_ADDRESS/g /opt/oai-nr-ue/etc/nr-ue.conf | tee /tmp/nr-ue.conf;
            sed -i -e s/@UE_IP_ADDRESS@/$UE_IP_ADDRESS/g /tmp/nr-ue.conf;
            sleep $UE_ID;
            {{- if $.Values.start.nrue}}
              {{- if $.Values.config.l2Fapi }}
                sh /opt/oai-nr-ue/etc/run_ue_l2proxy.sh;
                # exec  /opt/oai-nr-ue/bin/nr-uesoftmodem -O /tmp/nr-ue.conf $USE_ADDITIONAL_OPTIONS --node-number $(($UE_ID + 2));
              {{- else if eq $.Values.config.usrp "rfsim" }}
                exec /opt/oai-nr-ue/bin/nr-uesoftmodem -O /tmp/nr-ue.conf $USE_ADDITIONAL_OPTIONS --rfsimulator.serveraddr $RFSIM_IP_ADDRESS;
              {{- else}}
                exec  /opt/oai-nr-ue/bin/nr-uesoftmodem -O /tmp/nr-ue.conf $USE_ADDITIONAL_OPTIONS;
              {{- end }}
            {{- else}}
              exec /bin/sleep infinity;
            {{- end }}
        env:
          - name: UE_ID
            value: "{{ $ueId }}"
          - name: TZ
            value: {{ $.Values.config.timeZone }}
          - name: RFSIM_HOST
            value: {{ $.Values.config.rfSimServer }}
          - name: USE_ADDITIONAL_OPTIONS
          {{- if $.Values.config.l2Fapi }}
            value: {{ $.Values.config.l2FapiAdditionalOpts }}
          {{- else}}
            value: {{ $.Values.config.useAdditionalOptions }}
          {{- end}}
      {{- if $.Values.includeTcpDumpContainer }}
      - name: tcpdump
        image: "{{ $.Values.tcpdumpimage.repository }}:{{ $.Values.tcpdumpimage.version }}"
        imagePullPolicy: {{ $.Values.tcpdumpimage.pullPolicy }}
        {{- if $.Values.resources.define}}
        resources:
          requests:
            memory: {{ $.Values.resources.requests.tcpdump.memory | quote }}
            cpu: {{ $.Values.resources.requests.tcpdump.cpu | quote }}
          limits:
            memory: {{ $.Values.resources.limits.tcpdump.memory | quote }}
            cpu: {{ $.Values.resources.limits.tcpdump.cpu | quote }}
        {{- end}}
        securityContext:
           capabilities:
              add:
               - NET_ADMIN
               - NET_RAW
              drop:
               - ALL
        {{- if $.Values.start.tcpdump}}
        command:
          - /bin/sh
          - -c
          - /usr/bin/tcpdump -i any -w /tmp/pcap/{{ $.Chart.Name }}_`date +%Y-%m-%d_%H_%M-%S-%Z`.pcap
        {{- else}}
        command:
          - /bin/sleep
          - infinity
        {{- end}}
      {{- end }}
      volumes:
      - configMap:
          name: {{ $.Chart.Name }}-{{$ueId}}-configmap
        name: configuration-{{$ueId}}
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
      - hostPath:
          type: Directory
          path: {{ $.Values.config.oaiCodePath }}
        name: source
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      serviceAccountName: {{ $.Values.serviceAccount.name }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- if $.Values.nodeSelector}}
      nodeSelector: 
         {{- toYaml $.Values.nodeSelector | nindent 12 }}
      {{- end }}
      {{- if $.Values.nodeName}}
      nodeName: {{ $.Values.nodeName }}
      {{- end }}
{{- end }}

