site_name: OpenAirInterface
site_url: ""
site_author: OpenAirInterface Software Alliance
docs_dir: doc
theme:
  name: material
  custom_dir: doc/overrides
  logo: assets/images/OPEN_AIR_INTERFACE_LOGO.png
  favicon: assets/images/oai-logo-favicon.png
  features:
    - navigation.top
    - content.collapse
    - content.code.copy
  palette:
    primary: custom
    accent: custom
  font:
    text: Roboto
    code: Roboto Mono
extra:
  version:
    provider: mike

extra_css:
  - assets/stylesheets/extra.css

# Repository
repo_name: OAI Documentation GitLab
repo_url: https://gitlab.eurecom.fr/oai/openairinterface5g

## Navigation Entries Block Starts


## Navigation Entries Block Ends


markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - admonition
  - codehilite
  - footnotes
  - smarty
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

validation:
  links:
    not_found: ignore

plugins:
  - search
  - mermaid2
  - simple:
      include: [".txt", ".mmd", "README", ".conf", ".c", ".yaml", ".yml", ".cpp", ".md", ".png", ".h", ".json", ".patch", ".py", ".sh"]
      merge_docs_dir: true
      ignore:
        - README.md
