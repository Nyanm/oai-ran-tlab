## Navigation Entries Block Ends


markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - admonition
  - codehilite
  - footnotes
  - smarty
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

validation:
  links:
    not_found: ignore

plugins:
  - search
  - mermaid2
  - simple:
      include: [".txt", ".mmd", "README", ".conf", ".c", ".yaml", ".yml", ".cpp", ".md", ".png", ".h", ".json", ".patch", ".py", ".sh"]
      merge_docs_dir: true
      ignore:
        - README.md
